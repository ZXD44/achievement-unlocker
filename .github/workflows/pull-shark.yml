name: Pull Shark Multiplier

on:
  workflow_dispatch:
    inputs:
      prs_to_create:
        description: 'Number of PRs to create and auto-merge (e.g. 16, 32, 64)'
        required: true
        default: '16'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  pull-shark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Batch PR Generator & Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOTAL_COUNT: ${{ inputs.prs_to_create }}
        run: |
          echo "Starting batch PR generation for Pull Shark ($TOTAL_COUNT iterations)..."
          
          for i in $(seq 1 $TOTAL_COUNT); do
            TIMESTAMP=$(date +%s%N)
            BRANCH_NAME="shark-boost-$TIMESTAMP-$i"
            
            git checkout -b "$BRANCH_NAME" main
            
            echo "Pull Shark boost checkpoint #$i at $(date -u)" >> PULL_SHARK_LOG.txt
            git add PULL_SHARK_LOG.txt
            git commit -m "chore: pull shark progression record $i [skip ci]"
            git push origin "$BRANCH_NAME"
            
            # Create Pull Request
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "feat(shark): automate progression cycle $i" \
              --body "Automated PR iteration $i for Pull Shark badge milestone.")
            
            echo "Created PR: $PR_URL"
            
            # Merge Pull Request immediately
            gh pr merge "$PR_URL" --merge --delete-branch
            echo "Merged PR: $PR_URL"
            
            git checkout main
            git pull origin main
          done
          
          echo "Batch completed successfully."
