name: PR Lifecycle Automation

on:
  workflow_dispatch:
    inputs:
      prs_to_create:
        description: 'Number of lifecycle PRs to test'
        required: true
        default: '5'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  pr-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "ZXD44"
          git config user.email "168273485+ZXD44@users.noreply.github.com"

      - name: Run PR Lifecycle Check
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TOTAL_COUNT: ${{ inputs.prs_to_create }}
        run: |
          for i in $(seq 1 $TOTAL_COUNT); do
            TIMESTAMP=$(date +%s%N)
            BRANCH_NAME="ci/lifecycle-$TIMESTAMP-$i"

            git checkout -b "$BRANCH_NAME" main
            echo "CI lifecycle checkpoint #$i at $(date -u)" >> logs/pr-runs.log
            git add logs/pr-runs.log
            git commit -m "chore(ci): lifecycle checkpoint $i [skip ci]"
            git push origin "$BRANCH_NAME"

            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore(ci): lifecycle check $i" \
              --body "Automated CI/CD pull request lifecycle test #$i.")

            gh pr merge "$PR_URL" --merge --delete-branch
            git checkout main
            git pull origin main
            sleep 2
          done
